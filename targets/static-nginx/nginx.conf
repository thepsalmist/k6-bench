server {
    listen 80;
    access_log off;
    default_type application/json;
    location = /enqueue {
        return 202 '{"ok": true}';
    }
    location /items {
        if ($request_method = POST) {
            return 201 '{"ok": true}';
        }
        return 200 '{"ok": true}';
    }
    location / {
        return 200 '{"ok": true}';
    }
}
